name: CI & Type Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Deno Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Type Check
        run: deno check main.ts